x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

services:
  traefik:
    image: traefik:v3.7.12
    container_name: traefik
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    command:
      - "--api.dashboard=true"
      - "--providers.docker.endpoint=unix:///var/run/docker.sock"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.network=network_public"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      - "--entrypoints.web.http.redirections.entrypoint.permanent=true"
      - "--entrypoints.websecure.address=:443"
      - "--entrypoints.websecure.transport.respondingTimeouts.readTimeout=0"
      - "--certificatesresolvers.letsencryptresolver.acme.httpchallenge=true"
      - "--certificatesresolvers.letsencryptresolver.acme.httpchallenge.entrypoint=web"
      - "--certificatesresolvers.letsencryptresolver.acme.email=${EMAIL}"
      - "--certificatesresolvers.letsencryptresolver.acme.storage=/letsencrypt/acme.json"
      - "--log.level=INFO"
      - "--log.format=common"
      - "--accesslog=true"
      - "--ping=true"
      - "--ping.entrypoint=ping"
      - "--entryPoints.ping.address=:8082"
      - "--global.checkNewVersion=false"
      - "--global.sendAnonymousUsage=false"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
      - "traefik_letsencrypt:/letsencrypt"
    ports:
      - "80:80"
      - "443:443"
    networks:
      - network_public
    healthcheck:
      test: ["CMD", "wget", "http://localhost:8082/ping", "--spider"]
      interval: 10s
      timeout: 5s
      retries: 3
    logging: *default-logging

  soluschat-postgres:
    image: postgres:16.10
    container_name: soluschat-postgres
    restart: unless-stopped
    command:
      - postgres
      - -c
      - max_connections=200
      - -c
      - statement_timeout=60000
      - -c
      - idle_in_transaction_session_timeout=60000
    environment:
      - "POSTGRES_PASSWORD=${DB_PASS}"
      - "POSTGRES_USER=${DB_USER}"
      - "POSTGRES_DB=${DB_NAME}"
      - TZ=America/Sao_Paulo
    volumes:
      - postgres_volume:/var/lib/postgresql/data
      - ./config/postgres:/docker-entrypoint-initdb.d:ro
    networks:
      - network_public
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME} -h localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging: *default-logging

  soluschat-pgbouncer:
    image: edoburu/pgbouncer:v1.24.1-p1
    container_name: soluschat-pgbouncer
    restart: unless-stopped
    environment:
      DB_USER: "${DB_USER}"
      DB_PASSWORD: "${DB_PASS}"
      TZ: America/Sao_Paulo
    depends_on:
      soluschat-postgres:
        condition: service_healthy
    volumes:
      - ./config/pgbouncer/pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini:ro
      - ./config/pgbouncer/userlist.txt:/etc/pgbouncer/userlist.txt:ro
    networks:
      - network_public
    logging: *default-logging

  soluschat-redis:
    image: redis:7.2-alpine
    container_name: soluschat-redis
    restart: unless-stopped
    command:
      [
        "redis-server",
        "--requirepass",
        "${REDIS_PASSWORD}",
        "--appendonly",
        "yes",
        "--maxmemory-policy",
        "noeviction",
        "--tcp-keepalive",
        "60",
      ]
    environment:
      - "REDIS_PASSWORD=${REDIS_PASSWORD}"
      - TZ=America/Sao_Paulo
    volumes:
      - redis_volume:/data
    networks:
      - network_public
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    ulimits:
      nofile:
        soft: 50000
        hard: 100000
    logging: *default-logging

  soluschat-rabbitmq:
    image: rabbitmq:3.13-management
    container_name: soluschat-rabbitmq
    hostname: soluschat-rabbitmq
    restart: unless-stopped
    environment:
      - "RABBITMQ_DEFAULT_USER=${RABBIT_USER}"
      - "RABBITMQ_DEFAULT_PASS=${RABBIT_PASS}"
      - TZ=America/Sao_Paulo
    volumes:
      - rabbitmq_volume:/var/lib/rabbitmq
    networks:
      - network_public
    healthcheck:
      test: ["CMD", "rabbitmqctl", "status"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    logging: *default-logging

  backend:
    image: ghcr.io/${GHCR_IMAGE_USER}/${GHCR_IMAGE_REPO}/backend:${DOCKER_TAG}
    pull_policy: always
    container_name: backend
    restart: unless-stopped
    command: >
      /bin/bash -c "
      ln -sf /usr/share/zoneinfo/America/Sao_Paulo /etc/localtime;
      npx sequelize db:migrate &&
      npx sequelize db:seed:all &&
      exec node dist/server.js
      "
    environment:
      # AMBIENTE
      - "NODE_ENV=${NODE_ENV}"
      - TZ=America/Sao_Paulo
      # URLS E PORTAS
      - "BACKEND_URL=${BACKEND_URL}"
      - "FRONTEND_URL=${FRONTEND_URL}"
      - PORT=8080
      - PROXY_PORT=443
      # LOGS
      - LOG_LEVEL=info
      # GERAL
      - TIMEOUT_TO_IMPORT_MESSAGE=330
      # SEGURANÇA e AUTENTICAÇÃO
      - "JWT_SECRET=${JWT_SECRET}"
      - "JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}"
      - "COMPANY_TOKEN=${COMPANY_TOKEN}"
      - "ENV_TOKEN=${ENV_TOKEN}"
      - "MASTER_KEY=${MASTER_KEY}"
      - "MASTER_SETTINGS_ENCRYPTION_KEY=${MASTER_SETTINGS_ENCRYPTION_KEY}"
      # BAILEYS
      - BAILEYS_LOG_LEVEL=error
      - SESSIONS_DIR=./private
      # BANCO DE DADOS
      - DB_DIALECT=postgres
      - "DB_HOST=soluschat-pgbouncer"
      - DB_PORT=6432
      - "DB_HOST_DIRECT=soluschat-postgres"
      - DB_PORT_DIRECT=5432
      - "DB_USER=${DB_USER}"
      - "DB_PASS=${DB_PASS}"
      - "DB_NAME=${DB_NAME}"
      - DB_POOL_MAX=30
      - DB_POOL_MIN=5
      # REDIS
      - "REDIS_HOST=soluschat-redis"
      - REDIS_PORT=6379
      - "REDIS_URI=${REDIS_URI}"
      # MESSAGERIA
      - "RABBITMQ_HOST=soluschat-rabbitmq"
      - RABBITMQ_PORT=5672
      - "RABBITMQ_URI=${RABBITMQ_URI}"
      - RABBITMQ_EXCHANGE=messages
      - RABBITMQ_EXCHANGE_DLQ=messages.dlq
      - RABBITMQ_QUEUE_PREFIX=onticket
      - RABBITMQ_RETRY_DELAY=3000
      # VOZ
      - WACALLS_BASE_URL=http://soluschat-wacalls:8080
      - "WACALLS_SERVICE_TOKEN=${WACALLS_SERVICE_TOKEN}"
      - RECORDING_RETENTION_DAYS=90
      - RECORDING_MAX_SIZE_BYTES=209715200
      - MAIL_FROM_NAME=SolusChat
      # FACEBOOK
      - "FACEBOOK_APP_ID=${FACEBOOK_APP_ID}"
      - "FACEBOOK_APP_SECRET=${FACEBOOK_APP_SECRET}"
      - "VERIFY_TOKEN=${VERIFY_TOKEN}"
      # UAZAPI
      - "UAZAPI_BASE_URL=${UAZAPI_BASE_URL}"
      - "UAZAPI_ADMIN_TOKEN=${UAZAPI_ADMIN_TOKEN}"
      - "UAZAPI_WEBHOOK_URL=${BACKEND_URL}"
      # PAGAMENTOS (opcional)
      - "GERENCIANET_SANDBOX=${GERENCIANET_SANDBOX}"
      - "GERENCIANET_CLIENT_ID=${GERENCIANET_CLIENT_ID}"
      - "GERENCIANET_CLIENT_SECRET=${GERENCIANET_CLIENT_SECRET}"
      - "GERENCIANET_CHAVEPIX=${GERENCIANET_CHAVEPIX}"
      - "GERENCIANET_PIX_CERT=${GERENCIANET_PIX_CERT}"
      # GRUPOS
      - GROUP_META_TTL_MS=300000
      - GROUP_META_CACHE_MAX=5000
      - GROUP_META_MIN_INTERVAL_MS=250
      - GROUP_META_REDIS_ENABLED=true
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.backend.rule=Host(`${BACKEND_DOMAIN}`)"
      - "traefik.http.routers.backend.entrypoints=websecure"
      - "traefik.http.routers.backend.tls=true"
      - "traefik.http.routers.backend.tls.certresolver=letsencryptresolver"
      - "traefik.http.services.backend.loadbalancer.server.port=8080"
      - "traefik.http.middlewares.soluschat-headers.headers.stsSeconds=31536000"
      - "traefik.http.middlewares.soluschat-headers.headers.stsIncludeSubdomains=true"
      - "traefik.http.middlewares.soluschat-headers.headers.contentTypeNosniff=true"
      - "traefik.http.middlewares.soluschat-headers.headers.browserXssFilter=true"
      - "traefik.http.middlewares.soluschat-headers.headers.referrerPolicy=strict-origin-when-cross-origin"
      - "traefik.http.middlewares.soluschat-headers.headers.permissionsPolicy=microphone=(self), camera=(self), geolocation=(), payment=()"
      - "traefik.http.middlewares.soluschat-headers.headers.customResponseHeaders.Server="
      - "traefik.http.middlewares.soluschat-headers.headers.customResponseHeaders.X-Powered-By="
      - "traefik.http.middlewares.soluschat-compress.compress=true"
      - "traefik.http.middlewares.soluschat-compress.compress.minResponseBodyBytes=1024"
      - "traefik.http.routers.backend.middlewares=soluschat-compress@docker,soluschat-headers@docker"
    volumes:
      - backend_private:/backend/private
      - backend_public:/backend/public
    networks:
      - network_public
    depends_on:
      soluschat-postgres:
        condition: service_healthy
      soluschat-pgbouncer:
        condition: service_started
      soluschat-redis:
        condition: service_healthy
      soluschat-rabbitmq:
        condition: service_healthy
    logging: *default-logging

  frontend:
    image: ghcr.io/${GHCR_IMAGE_USER}/${GHCR_IMAGE_REPO}/frontend:${DOCKER_TAG}
    pull_policy: always
    container_name: frontend
    restart: unless-stopped
    environment:
      - "NODE_ENV=${NODE_ENV}"
      - PORT=3000
      - "REACT_APP_BACKEND_URL=${BACKEND_URL}"
      - "REACT_APP_FACEBOOK_APP_ID=${FACEBOOK_APP_ID}"
      - "REACT_APP_NUMBER_SUPPORT=${NUMBER_SUPPORT}"
      - "REACT_APP_REQUIRE_BUSINESS_MANAGEMENT=${REQUIRE_BUSINESS_MANAGEMENT}"
      - "REACT_APP_ENV_TOKEN=${ENV_TOKEN}"
      - "ENV_TOKEN=${ENV_TOKEN}"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.frontend.rule=Host(`${FRONTEND_DOMAIN}`)"
      - "traefik.http.routers.frontend.entrypoints=websecure"
      - "traefik.http.routers.frontend.tls=true"
      - "traefik.http.routers.frontend.tls.certresolver=letsencryptresolver"
      - "traefik.http.services.frontend.loadbalancer.server.port=3000"
      - "traefik.http.routers.frontend.middlewares=soluschat-compress@docker,soluschat-headers@docker"
    networks:
      - network_public
    logging: *default-logging

  wacalls:
    image: ghcr.io/${GHCR_IMAGE_USER}/${GHCR_IMAGE_REPO}/wacalls:${DOCKER_TAG}
    pull_policy: always
    container_name: soluschat-wacalls
    restart: unless-stopped
    environment:
      - TZ=America/Sao_Paulo
      - "WACALLS_DSN=${WACALLS_DSN}"
      - "WACALLS_SERVICE_TOKEN=${WACALLS_SERVICE_TOKEN}"
      - "WACALLS_PUBLIC_IP=${WACALLS_PUBLIC_IP}"
      - "WACALLS_WEBRTC_UDP_PORT=${WACALLS_WEBRTC_UDP_PORT}"
      - "WEBRTC_UDP_PORT=${WACALLS_WEBRTC_UDP_PORT}"
      - WACALLS_RECORDINGS_DIR=/data/recordings
      - WACALLS_RECORDINGS_MAX_BYTES=5368709120
    ports:
      - "${WACALLS_WEBRTC_UDP_PORT}:${WACALLS_WEBRTC_UDP_PORT}/udp"
    volumes:
      - wacalls_recordings:/data
    networks:
      - network_public
    depends_on:
      soluschat-postgres:
        condition: service_healthy
    logging: *default-logging

volumes:
  traefik_letsencrypt:
  postgres_volume:
  redis_volume:
  rabbitmq_volume:
  backend_private:
  backend_public:
  wacalls_recordings:

networks:
  network_public:
    name: network_public
    driver: bridge
